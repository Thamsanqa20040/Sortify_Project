<ion-header>
  <ion-toolbar>
    <ion-title>Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="profile-page" fullscreen>

  <div class="profile-header">
    <h2>My Profile</h2>
    <ion-button fill="solid" size="small" color="success">Edit</ion-button>
  </div>

  <div class="profile-info">
    <ion-avatar>
      <img src="assets/profile/profile-picture.png" alt="Profile Photo">
    </ion-avatar>
    <h3>Sipho Ndlovu</h3>
    <p class="email">sihle.ngubo&#64;example.com</p>
    <p class="points">Total Points: <span class="gold">350</span></p>
  </div>

  <ion-card class="details-card">
    <ion-item lines="none">
      <ion-icon name="call-outline" slot="start" color="success"></ion-icon>
      <ion-label>+27 73 123 4567</ion-label>
    </ion-item>
    <ion-item lines="none">
      <ion-icon name="location-outline" slot="start" color="success"></ion-icon>
      <ion-label>123 Mangosuthu Highway, Umlazi, Durban</ion-label>
    </ion-item>
    <ion-item lines="none">
      <ion-icon name="calendar-outline" slot="start" color="success"></ion-icon>
      <ion-label>1990-05-15</ion-label>
    </ion-item>
    <ion-item lines="none">
      <ion-icon name="person-outline" slot="start" color="success"></ion-icon>
      <ion-label>Male</ion-label>
    </ion-item>
  </ion-card>

  <ion-list>
    <ion-item button>
      <ion-icon name="create-outline" slot="start" color="success"></ion-icon>
      <ion-label>Complete Profile</ion-label>
    </ion-item>

    <ion-item button>
      <ion-icon name="notifications-outline" slot="start" color="success"></ion-icon>
      <ion-label>Notifications</ion-label>
      <ion-badge slot="end" color="danger">3</ion-badge>
    </ion-item>

    <ion-item button>
      <ion-icon name="settings-outline" slot="start" color="success"></ion-icon>
      <ion-label>App Settings</ion-label>
    </ion-item>

    <ion-item button>
      <ion-icon name="shield-checkmark-outline" slot="start" color="success"></ion-icon>
      <ion-label>Privacy & Security</ion-label>
    </ion-item>

    <ion-item button>
      <ion-icon name="help-circle-outline" slot="start" color="success"></ion-icon>
      <ion-label>Help & Support</ion-label>
    </ion-item>

    <ion-item button lines="none">
      <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
      <ion-label class="logout">Logout</ion-label>
    </ion-item>
  </ion-list>

  <!-- Bottom Navigation inside content -->
  <div class="bottom-nav">
    <a [routerLink]="['/home']" routerLinkActive="active">
      <img src="assets/icon/home.png" alt="Home" />
    </a>
    <a [routerLink]="['/rewards']" routerLinkActive="active">
      <img src="assets/icon/medal.png" alt="Rewards" />
    </a>
    <a [routerLink]="['/report']" class="add-btn" routerLinkActive="active">
      <img src="assets/icon/add.png" alt="Report" />
    </a>
    <a [routerLink]="['/my-reports']" routerLinkActive="active">
      <img src="assets/icon/report.png" alt="My Reports" />
    </a>
    <a [routerLink]="['/profile']" routerLinkActive="active">
      <img src="assets/icon/user.png" alt="Profile" />
    </a>
  </div>

</ion-content>
