<ion-header [translucent]="true">
  <ion-toolbar color="success">
    <ion-title>Manage Recycling Sites</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Add Business Section -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Add New Business</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Business Name</ion-label>
        <ion-input [(ngModel)]="newBusiness.name"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Location</ion-label>
        <ion-input [(ngModel)]="newBusiness.location"></ion-input>
      </ion-item>

      <ion-button expand="block" color="primary" (click)="addBusiness()">
        Add Business
      </ion-button>
    </ion-card-content>
  </ion-card>

  <!-- Existing Businesses Section -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Existing Businesses</ion-card-title>
    </ion-card-header>

    <ion-card-content *ngIf="businesses.length > 0; else noBusinesses">
      <ion-list>
        <ion-item-sliding *ngFor="let business of businesses; let i = index">
          <ion-item>
            <ion-label>
              <h2>{{ business.name }}</h2>
              <p>{{ business.location }}</p>
            </ion-label>
          </ion-item>

          <ion-item-options side="end">
            <ion-item-option color="danger" (click)="removeBusiness(i)">
              Delete
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      </ion-list>
    </ion-card-content>

    <ng-template #noBusinesses>
      <p class="ion-text-center">No businesses found.</p>
    </ng-template>
  </ion-card>

</ion-content>
