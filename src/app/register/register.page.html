<ion-header> 
  <ion-toolbar> 
  <ion-title>Register</ion-title> 
  </ion-toolbar> 
  </ion-header> 
  <ion-content> 
  <ion-card> 
  <ion-card-header> 
  <ion-card-title>Create an Account</ion-card-title> 
  </ion-card-header> 
  <ion-card-content> 
  <ion-input [(ngModel)]="email" type="email" placeholder="Email"></ion-input> 
  <ion-input [(ngModel)]="password" type="password" 
  placeholder="Password"></ion-input> 
  <ion-button expand="full" (click)="register()">Register</ion-button> 
  </ion-card-content> 
  </ion-card> 
  </ion-content>
