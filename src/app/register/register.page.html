<ion-content class="register-content">
  <div class="register-container">
    <!-- Header Section -->
    <div class="header-section">
      <div class="logo-container">
        <ion-icon name="person-add-outline" class="logo-icon"></ion-icon>
      </div>
      <h1 class="register-title">Create Account</h1>
      <p class="register-subtitle">Join us today and get started</p>
    </div>

    <!-- Registration Form -->
    <form class="register-form" (ngSubmit)="register()">
      <!-- Full Name Input -->
      <div class="input-group">
        <label class="input-label">Full Name</label>
        <div class="input-container">
          <ion-icon name="person-outline" class="input-icon"></ion-icon>
          <input 
            type="text" 
            class="input-field" 
            [(ngModel)]="fullName" 
            name="fullName"
            placeholder="Enter your full name"
            required
          />
        </div>
      </div>

      <!-- Email Input -->
      <div class="input-group">
        <label class="input-label">Email Address</label>
        <div class="input-container">
          <ion-icon name="mail-outline" class="input-icon"></ion-icon>
          <input 
            type="email" 
            class="input-field" 
            [(ngModel)]="email" 
            name="email"
            placeholder="Enter your email"
            required
          />
        </div>
      </div>

      <!-- Password Input -->
      <div class="input-group">
        <label class="input-label">Password</label>
        <div class="input-container">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            class="input-field" 
            [(ngModel)]="password" 
            name="password"
            placeholder="Create a password"
            required
          />
          <ion-icon 
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" 
            class="toggle-password" 
            (click)="togglePassword()"
          ></ion-icon>
        </div>
      </div>

      <!-- Confirm Password Input -->
      <div class="input-group">
        <label class="input-label">Confirm Password</label>
        <div class="input-container">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <input 
            [type]="showConfirmPassword ? 'text' : 'password'" 
            class="input-field" 
            [(ngModel)]="confirmPassword" 
            name="confirmPassword"
            placeholder="Confirm your password"
            required
          />
          <ion-icon 
            [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'" 
            class="toggle-password" 
            (click)="toggleConfirmPassword()"
          ></ion-icon>
        </div>
      </div>

      <!-- Terms and Conditions -->
      <div class="terms-container">
        <ion-checkbox [(ngModel)]="acceptTerms" name="acceptTerms"></ion-checkbox>
        <span class="terms-text">
          I agree to the <a href="#" class="terms-link">Terms & Conditions</a> 
          and <a href="#" class="terms-link">Privacy Policy</a>
        </span>
      </div>

      <!-- Register Button -->
      <ion-button 
        type="submit" 
        class="register-button" 
        expand="block" 
        [disabled]="!acceptTerms || isLoading"
      >
        <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
        <span *ngIf="!isLoading">Create Account</span>
        <span *ngIf="isLoading">Creating Account...</span>
      </ion-button>
    </form>

    <!-- Login Link -->
    <div class="login-link">
      <span>Already have an account? </span>
      <a routerLink="/login" class="login-link-text">Sign In</a>
    </div>

    <!-- Social Login Section -->
    <div class="divider">
      <span class="divider-text">or continue with</span>
    </div>

    <div class="social-buttons">
      <ion-button fill="outline" class="social-button google-button">
        <ion-icon name="logo-google" slot="start"></ion-icon>
        Google
      </ion-button>
      <ion-button fill="outline" class="social-button facebook-button">
        <ion-icon name="logo-facebook" slot="start"></ion-icon>
        Facebook
      </ion-button>
    </div>
  </div>
</ion-content>
