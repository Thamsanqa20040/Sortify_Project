<ion-header>
  <ion-toolbar>
    <ion-title>Report</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="report-content">

  <div class="container">
    <h2>Report Waste</h2>
    <p class="subtext">Help keep your community clean and earn points by reporting waste</p>

    <h3>Waste Type</h3>
    <p class="subtext">Select the type of waste you're reporting</p>

    <div class="waste-types">
      <ion-button
        *ngFor="let type of wasteTypes"
        [color]="selectedType === type.type ? 'primary' : 'light'"
        (click)="selectWasteType(type.type)"
        shape="round"
        size="small"
      >
        {{ type.label }}
      </ion-button>
    </div>

    <h3>Description</h3>
    <p class="subtext">Provide details about the waste</p>

    <ion-textarea
      placeholder="E.g., Several plastic bottles and bags near the park entrance"
      [(ngModel)]="description"
      rows="4"
      fill="solid"
    ></ion-textarea>

    <h3>Photo</h3>
    <p class="subtext">Upload or take a photo of the waste</p>

    <div class="photo-buttons">
      <ion-button expand="block" fill="outline" (click)="uploadPhoto()">Upload Photo</ion-button>
      <ion-button expand="block" fill="outline" (click)="takePhoto()">Take Photo</ion-button>
    </div>

    <ion-button
      expand="block"
      color="success"
      [disabled]="!selectedType || !location || isLoading"
      (click)="submitReport()"
    >
      <ion-spinner *ngIf="isLoading" name="dots" slot="start"></ion-spinner>
      Submit Report
    </ion-button>
  </div>

  <!-- Bottom Navigation (Icons Only) -->
  <div class="bottom-nav">
    <div class="nav-item">
      <a [routerLink]="['/home']" title="Home">
        <img src="assets/icon/home.png" alt="Home" />
      </a>
    </div>
    <div class="nav-item">
      <a [routerLink]="['/rewards']" title="Rewards">
        <img src="assets/icon/medal.png" alt="Rewards" />
      </a>
    </div>
    <div class="nav-item add-btn">
      <a [routerLink]="['/report']" title="Add Report">
        <img src="assets/icon/add.png" alt="Add" />
      </a>
    </div>
    <div class="nav-item">
      <a [routerLink]="['/reports']" title="Reports">
        <img src="assets/icon/report.png" alt="Reports" />
      </a>
    </div>
    <div class="nav-item">
      <a [routerLink]="['/profile']" title="Profile">
        <img src="assets/icon/user.png" alt="Profile" />
      </a>
    </div>
  </div>

</ion-content>
